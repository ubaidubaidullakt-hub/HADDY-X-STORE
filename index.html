<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HADDY-X-STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { background: #0a0a0a; color: white; margin: 0; font-family: sans-serif; }
        .acc-card { background: #111; border: 1px solid #222; border-radius: 15px; margin-bottom: 25px; overflow: hidden; }
        .img-box img { width: 100%; height: 220px; object-fit: cover; border-bottom: 2px solid #222; }
    </style>
</head>
<body>

    <header class="p-5 border-b border-zinc-800 bg-black text-center sticky top-0 z-50">
        <h1 class="text-2xl font-black text-blue-500 tracking-widest">HADDY-X-STORE</h1>
    </header>

    <div id="accountList" class="p-4 max-w-md mx-auto">
        <div id="loader" class="text-center py-20">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-500 mx-auto mb-4"></div>
            <p class="text-gray-500 text-sm">Loading Store...</p>
        </div>
    </div>

    <script>
        // YOUR FIREBASE CONFIG
        const firebaseConfig = {
            databaseURL: "https://accsales-19cb9-default-rtdb.firebaseio.com",
            projectId: "accsales-19cb9"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const listDiv = document.getElementById('accountList');

        // Fetch Data
        const accountsRef = database.ref('accounts');
        accountsRef.on('value', (snapshot) => {
            const data = snapshot.val();
            listDiv.innerHTML = ""; // Clear loader

            if (!data) {
                listDiv.innerHTML = "<p class='text-center text-gray-600 mt-10'>No accounts listed yet.</p>";
                return;
            }

            // Loop through data
            Object.keys(data).reverse().forEach(id => {
                const acc = data[id];
                const card = `
                    <div class="acc-card shadow-2xl">
                        <div class="img-box">
                            <img src="${acc.image}" alt="Free Fire Account">
                        </div>
                        <div class="p-5">
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-3xl font-black text-green-500">₹${acc.price}</span>
                                <span class="bg-blue-900/30 text-blue-400 text-[10px] px-2 py-1 rounded-full border border-blue-800 font-bold uppercase">Verified</span>
                            </div>
                            <p class="text-gray-400 text-sm mb-5 leading-relaxed">${acc.description}</p>
                            
                            <div class="grid gap-2">
                                <a href="${acc.video}" target="_blank" class="bg-zinc-800 text-center py-2 rounded-lg text-xs font-bold border border-zinc-700 hover:bg-zinc-700 transition">VIEW COLLECTION</a>
                                <a href="https://t.me/ROCK_HEREE" class="bg-blue-600 text-white text-center py-4 rounded-xl font-black uppercase tracking-tighter text-lg shadow-lg shadow-blue-900/20">BUY NOW</a>
                            </div>
                        </div>
                    </div>`;
                listDiv.innerHTML += card;
            });
        }, (error) => {
            listDiv.innerHTML = `<p class="text-red-500 text-center">Error: ${error.message}</p>`;
        });
    </script>
</body>
</html>
