<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a0a; color: white; transition: 0.3s; }
        .light { background: #f3f4f6; color: #1f2937; }
        .acc-card { background: #161616; border: 1px solid #222; border-radius: 12px; overflow: hidden; }
        .light .acc-card { background: #fff; border-color: #ddd; }
        .img-container img { width: 100%; height: 200px; object-fit: cover; }
    </style>
</head>
<body>
    <header class="p-4 border-b border-zinc-800 flex justify-between items-center bg-black/50 sticky top-0 backdrop-blur-md z-50">
        <h1 class="text-xl font-black text-yellow-500">FF HUB</h1>
        <button onclick="document.body.classList.toggle('light')" class="p-2 bg-zinc-800 rounded-full text-xs">MODE</button>
    </header>

    <div id="accountList" class="p-4 grid gap-6 max-w-md mx-auto">
        <p class="text-center text-gray-500 py-10">Loading accounts...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://accsales-19cb9-default-rtdb.firebaseio.com", // Your Database URL
            projectId: "accsales-19cb9",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const list = document.getElementById('accountList');
        const dbRef = ref(db, 'accounts');

        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            list.innerHTML = "";
            if (!data) return list.innerHTML = "<p class='text-center'>No accounts yet.</p>";

            Object.keys(data).reverse().forEach(id => {
                const acc = data[id];
                list.innerHTML += `
                <div class="acc-card shadow-xl">
                    <div class="img-container">
                        <img src="${acc.image}">
                    </div>
                    <div class="p-4">
                        <h2 class="text-2xl font-bold text-yellow-500">₹${acc.price}</h2>
                        <p class="text-sm opacity-70 my-2">${acc.description}</p>
                        <div class="grid gap-2 mt-4">
                            <a href="${acc.video}" target="_blank" class="bg-zinc-800 text-center py-2 rounded-lg text-xs font-bold">COLLECTION VIDEO</a>
                            <a href="https://t.me/ROCK_HEREE" class="bg-green-600 text-white text-center py-3 rounded-lg font-bold">BUY NOW</a>
                        </div>
                    </div>
                </div>`;
            });
        });
    </script>
</body>
</html>
